name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Engine self-test
        run: |
          swift build -c release --product quitall
          .build/release/quitall selftest

      - name: Build QuitAll.app (universal, ad-hoc signed)
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || V="0.0.0-dev"
          VERSION="$V" UNIVERSAL=1 Scripts/build-app.sh
          VERSION="$V" Scripts/make-dmg.sh
          VERSION="$V" Scripts/make-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: QuitAll-installers
          path: |
            build/*.dmg
            build/*.pkg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.pkg
